[package]
name = "forest-editor"
version = "0.1.0"
description = "Forest Editor stage 1 local desktop prototype"
edition = "2021"
rust-version = "1.100"

[lib]
name = "forest_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.2", features = ["v4"] }
tempfile = "=3.27.0"

reqwest = { version = "=0.13.5", features = ["json"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "=2.14.1"
